<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잭슨 연결 중</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b0b0d;color:#e9e9ee;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
       text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:420px}
  h1{font-size:20px;margin:0 0 12px;color:#2f7dfb}
  p{font-size:15px;line-height:1.6;margin:8px 0;color:#b9b9c4}
  code{background:#1a1a20;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>잭슨 비서실장</h1>
  <p id="msg">노트북 주소를 확인하는 중…</p>
</div>
<script>
(function () {
  var RAW = "https://raw.githubusercontent.com/gksfka5771-bit/jackson-link/main/ip.txt";
  var PORT = 8765;
  var msg = document.getElementById("msg");

  // 토큰은 # 뒤에 둔다. 이 부분은 브라우저가 서버로 보내지 않으므로
  // GitHub에는 절대 전달되지 않는다.
  var token = "";
  var hash = location.hash.replace(/^#/, "");
  hash.split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0 && kv.slice(0, i) === "t") token = decodeURIComponent(kv.slice(i + 1));
  });

  function valid(ip) {
    var p = ip.split(".");
    if (p.length !== 4) return false;
    return p.every(function (x) {
      return x !== "" && /^[0-9]+$/.test(x) && +x >= 0 && +x <= 255;
    });
  }

  fetch(RAW + "?_=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("주소 파일을 못 읽었습니다 (HTTP " + r.status + ")");
      return r.text();
    })
    .then(function (text) {
      var ip = text.trim().split(/\s/)[0];
      if (!valid(ip)) throw new Error("주소 형식이 올바르지 않습니다: " + ip);
      msg.textContent = ip + " 로 연결합니다…";
      var url = "http://" + ip + ":" + PORT + "/";
      if (token) url += "?t=" + encodeURIComponent(token);
      location.replace(url);
    })
    .catch(function (e) {
      msg.innerHTML = "연결 실패<br><br>" + e.message +
        "<br><br>노트북이 켜져 있고 폰과 같은 네트워크(집 와이파이 또는 테더링)에 있는지 확인해 주십시오.";
    });
})();
</script>
</body>
</html>
